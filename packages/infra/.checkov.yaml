# Checkov settings for the template that `cdk synth` writes (task 19, moved to CDK in task 25). From packages/infra:
#
#   pnpm exec cdk synth --quiet
#   checkov --config-file .checkov.yaml -f dist/cdk.out/Mergescape.template.json
#
# (`pnpm --filter @mergescape/infra validate` does both.) Every check skipped below is a known gap that costs
# money or does not apply to a public Function URL stack at personal scale, so a new failure is a real finding.
# The same list is in packages/infra/README.md ("Things to know").
framework:
  - cloudformation
compact: true
quiet: true
skip-check:
  # DynamoDB point-in-time recovery: billed per GB-month beyond the free tier. The table is retained when
  # the stack is deleted, and every player can export their own data.
  - CKV_AWS_28
  # Customer-managed KMS keys (table, log groups, Lambda environment): each key costs about 1 USD a month.
  # Data is encrypted at rest with AWS-owned and AWS-managed keys. The environment holds the table name,
  # SSM prefix, Pages origin and stage, never a secret (those are SSM SecureStrings).
  - CKV_AWS_119
  - CKV_AWS_158
  - CKV_AWS_173
  # Dead-letter queue: ingest is called synchronously by GitHub over a Function URL, which has no DLQ, and
  # GitHub's "Redeliver" replays a failed delivery.
  - CKV_AWS_116
  # VPC: both functions call only public AWS endpoints and GitHub; a VPC would need a NAT gateway.
  - CKV_AWS_117
  # Function URLs with auth NONE: the design needs two public endpoints. ingest is protected by the HMAC
  # signature of every GitHub delivery, api by its JWT and an Origin check, and reserved concurrency (10 and
  # 5) bounds what either can cost. IAM-authenticated URLs would stop GitHub and the browser from calling.
  - CKV_AWS_258
  # CloudFront access logs need a bucket and would record which logins' badges are requested.
  - CKV_AWS_86
  # The default CloudFront certificate cannot set a TLS floor. A custom domain (v2) can.
  - CKV_AWS_174
  # WAF costs a monthly fee plus per-rule charges; reserved concurrency and the budgets bound the blast radius.
  - CKV_AWS_68
