name: Deploy

# Deploys the SAM stack to AWS with GitHub OIDC (no long-lived AWS keys), then publishes the
# client to GitHub Pages. See packages/infra/README.md for the one-time setup.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN  required; the workflow is skipped while it is empty (forks, new clones)
#   PAGES_ORIGIN         required; https://<owner>.github.io (CORS origin, client CSP)
#   ALERT_EMAIL          required; receives the AWS Budgets alerts
#   AWS_REGION           optional, default us-east-1
#   STACK_NAME           optional, default mergescape
#   SSM_PREFIX           optional, default /mergescape
#   STAGE                optional, default prod

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'mergescape' }}
  SAM_CLI_TELEMETRY: '0'

jobs:
  stack:
    name: Deploy SAM stack
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
    outputs:
      api_origin: ${{ steps.outputs.outputs.api_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Validate template
        run: pnpm --filter @mergescape/infra validate
      # esbuild comes from the pinned devDependency in packages/infra, which `pnpm exec` puts on PATH.
      - name: Build
        run: pnpm --filter @mergescape/infra exec sam build
      - name: Deploy
        working-directory: packages/infra
        env:
          PAGES_ORIGIN: ${{ vars.PAGES_ORIGIN }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          SSM_PREFIX: ${{ vars.SSM_PREFIX || '/mergescape' }}
          STAGE: ${{ vars.STAGE || 'prod' }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "PagesOrigin=$PAGES_ORIGIN" \
              "AlertEmail=$ALERT_EMAIL" \
              "SsmPrefix=$SSM_PREFIX" \
              "Stage=$STAGE"

      - name: Read stack outputs
        id: outputs
        run: |
          api_url=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          case "$api_url" in
            https://*) ;;
            *) echo "::error::Stack output ApiUrl is missing or not an https URL: '$api_url'"; exit 1 ;;
          esac
          echo "api_origin=${api_url%/}" >> "$GITHUB_OUTPUT"

  pages:
    name: Publish client to GitHub Pages
    needs: stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write # deploy-pages
      id-token: write # deploy-pages verifies the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build client
        env:
          VITE_API_ORIGIN: ${{ needs.stack.outputs.api_origin }}
        run: pnpm --filter @mergescape/client --if-present run build

      # The client is optional until it exists: skip publishing instead of failing the workflow.
      - name: Check for client build output
        id: dist
        run: |
          if [ -f packages/client/dist/index.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/client/dist/index.html not found, skipping the Pages deployment."
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.dist.outputs.exists == 'true'
        with:
          path: packages/client/dist
      - id: deployment
        uses: actions/deploy-pages@v5
        if: steps.dist.outputs.exists == 'true'
