name: CI

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without a code change, so the audit also runs weekly.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Vitest with coverage over every package. It fails below the thresholds in vitest.config.ts:
      # shared 95 % lines and 100 % branches on score.ts (Requirement 4.10), backend 90 %, client 90 %.
      - run: pnpm test
      - name: Keep the coverage summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build

  # The CDK stack: synthesize it (no AWS credentials, no lookups), lint the template it writes with cfn-lint
  # and with checkov (documented skip list in packages/infra/.checkov.yaml), and run the assertions on it.
  template:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Synthesize the stack
        run: pnpm --filter @mergescape/infra exec cdk synth --quiet --no-lookups
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.60.0 checkov==3.4.3
      - name: cfn-lint
        working-directory: packages/infra
        run: cfn-lint
      - name: checkov
        working-directory: packages/infra
        run: checkov --config-file .checkov.yaml -f dist/cdk.out/Mergescape.template.json
      - name: Assertions on the stack and its bundles
        run: pnpm --filter @mergescape/infra test

  # Production dependencies are what ends up in the Lambda bundles.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via corepack
        run: corepack enable
      - run: pnpm audit --prod --audit-level=high
