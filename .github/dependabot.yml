# Weekly dependency updates. Minor and patch updates arrive as one grouped pull request per ecosystem;
# major updates stay separate so each one gets its own review.
#
# Versions live in the `catalog:` of pnpm-workspace.yaml, which Dependabot reads through the npm
# ecosystem at the repository root. If a run ever opens no pull requests for the catalog, check the
# "Dependabot" page under Insights > Dependency graph for errors.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
